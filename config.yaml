  #   perdendo i piu' economici. "ita" e "sealed" sono attributi che il
  #   venditore puo' scrivere o no, quindi non sono parole chiave.
  #
  # * NIENTE "box" fra le escluse: ETB sta per Elite Trainer BOX, e chi scrive
  #   l'acronimo per esteso verrebbe scartato dal nostro stesso filtro.
